<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Financial Crisis — Causal Loops</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background: #f5f4f0; margin: 0; padding: 32px; color: #2c2c2a; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 24px; }
  .card { background: #ffffff; border: 1px solid #d3d1c7; border-radius: 12px; padding: 24px; margin-bottom: 32px; max-width: 720px; }
  h2 { font-size: 16px; font-weight: 600; margin-top: 0; }
  svg { width: 100%; height: auto; display: block; background: #ffffff; }
  button { margin-top: 14px; padding: 8px 16px; font-size: 14px; border-radius: 6px; border: 1px solid #185fa5; background: #185fa5; color: #fff; cursor: pointer; }
  button:hover { background: #0c447c; }
</style>
</head>
<body>

<h1>Financial Crisis — Systems Thinking Diagrams</h1>

<div class="card">
  <h2>Reinforcing loop (R): the housing bubble</h2>
  <svg id="svg-r" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <rect x="40" y="60" width="130" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
    <text x="105" y="80" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">Cheap credit</text>
    <text x="105" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13">Fed funds &lt;2%, 2001-04</text>

    <rect x="190" y="60" width="130" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
    <text x="255" y="80" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">More lending &amp; MBS</text>
    <text x="255" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13">Subprime, securitized</text>

    <rect x="340" y="60" width="130" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
    <text x="405" y="80" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">Home prices rise</text>
    <text x="405" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13">Ratio 2.9x to 4.6x income</text>

    <rect x="490" y="60" width="130" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
    <text x="555" y="80" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">Confidence &amp; leverage</text>
    <text x="555" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13">Leverage 10x to 40x</text>

    <line x1="170" y1="88" x2="188" y2="88" stroke="#000000" stroke-width="1" marker-end="url(#arrow-r)"/>
    <line x1="320" y1="88" x2="338" y2="88" stroke="#000000" stroke-width="1" marker-end="url(#arrow-r)"/>
    <line x1="470" y1="88" x2="488" y2="88" stroke="#000000" stroke-width="1" marker-end="url(#arrow-r)"/>

    <path d="M555 116 L555 180 L105 180 L105 118" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow-r)"/>
    <circle cx="330" cy="180" r="14" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
    <text x="330" y="180" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">R</text>
    <text x="330" y="205" text-anchor="middle" font-size="12" fill="#444441">Drives more demand for mortgage-backed securities</text>
  </svg>
  <button onclick="downloadPNG('svg-r','reinforcing_loop.png')">Download as PNG</button>
</div>

<div class="card">
  <h2>Balancing loop (B): the regulatory response that didn't engage</h2>
  <svg id="svg-b" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <rect x="40" y="60" width="130" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="105" y="80" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#042C53">Leverage &amp; risk rise</text>
    <text x="105" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">30-40x, opaque derivatives</text>

    <rect x="190" y="60" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="255" y="80" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Regulatory scrutiny</text>
    <text x="255" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">Should tighten, didn't</text>

    <rect x="340" y="60" width="130" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="405" y="80" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#042C53">Lending standards</text>
    <text x="405" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">Should curb subprime</text>

    <rect x="490" y="60" width="130" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="555" y="80" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#042C53">Risk-taking eases</text>
    <text x="555" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">Would stabilize system</text>

    <line x1="170" y1="88" x2="188" y2="88" stroke="#000000" stroke-width="1" marker-end="url(#arrow-b)"/>
    <line x1="320" y1="88" x2="338" y2="88" stroke="#000000" stroke-width="1" marker-end="url(#arrow-b)"/>
    <line x1="470" y1="88" x2="488" y2="88" stroke="#000000" stroke-width="1" marker-end="url(#arrow-b)"/>

    <path d="M555 116 L555 180 L105 180 L105 118" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow-b)"/>
    <circle cx="330" cy="180" r="14" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="330" y="180" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#042C53">B</text>
    <text x="330" y="205" text-anchor="middle" font-size="12" fill="#444441">Dashed = loop link that failed to engage</text>
  </svg>
  <button onclick="downloadPNG('svg-b','balancing_loop.png')">Download as PNG</button>
</div>

<script>
function downloadPNG(svgId, filename) {
  const svgEl = document.getElementById(svgId);
  const serializer = new XMLSerializer();
  let svgString = serializer.serializeToString(svgEl);
  if (!svgString.match(/^<svg[^>]+xmlns="http:\/\/www\.w3\.org\/2000\/svg"/)) {
    svgString = svgString.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
  }
  const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  img.onload = function () {
    const scale = 2; // higher-res export
    const canvas = document.createElement('canvas');
    canvas.width = 680 * scale;
    canvas.height = 260 * scale;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0, 680, 260);
    URL.revokeObjectURL(url);
    canvas.toBlob(function (blob) {
      const link = document.createElement('a');
      link.download = filename;
      link.href = URL.createObjectURL(blob);
      link.click();
    }, 'image/png');
  };
  img.src = url;
}
</script>

</body>
</html>
