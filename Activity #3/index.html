<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="headerr" style="text-align: center;">
    <h1>Activity 3: Task Tracker</h1>
    <p>Stay on top of your day.</p>
  </header>

  <main>
    <section class="task-form">
      <input type="text" id="taskInput" placeholder="Add a new task...">
      <button id="addBtn" class="btn-Primary">Add Task</button>
    </section>

    <section>
      <p>Total tasks: <span id="taskCount">2</span></p>
      <ul id="tasklist">
        <li class="task">Buy groceries</li>
        <li class="task">Walk the dog</li>
      </ul>
    </section>
  </main>

  <footer class="footer">
    <p>Built for CSIT &mdash; Web Programming</p>
  </footer>

  <script src="javascript.js"></script>
</body>
</html>
